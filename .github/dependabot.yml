version: 2
updates:
  # Go module for the installer CLI.
  - package-ecosystem: "gomod"
    directory: "/cli"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-deps:
        patterns: ["*"]

  # GitHub Actions used by the workflows (keeps the pinned action tags current).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  # The website (site/, pnpm).
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(site)"
    groups:
      site-deps:
        patterns: ["*"]
