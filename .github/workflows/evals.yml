name: evals

# Behavioral evals (`claude plugin eval`) — real model calls, so never on PRs:
# nightly + on demand. Zero-cost graders only (tool_used / regex / tool_order), one arm.
# 21 cases: routing per command family, two negatives, guardrail/state fixtures, one
# authoring-standard regression. Ablation stays `none`: under with-without the Skill
# graders are indicators, not scores, so routing cases would have nothing to pass.
# Guardrail/state cases need Bash + git fixtures: --scaffold + an explicit tool grant.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Require an API key
        if: env.ANTHROPIC_API_KEY == ''
        run: |
          echo "::error::ANTHROPIC_API_KEY secret not set — evals cannot run"
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Bash sandbox prerequisites (Linux)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat
      - name: Install Claude Code CLI
        # Same pin as validate.yml; models pinned below so a rollout isn't read as a regression.
        run: npm install -g @anthropic-ai/claude-code@2.1.290
      - name: Run eval suite
        run: >
          claude plugin eval ./orc
          --ablation none --runs 2 --threshold 0.8
          --max-cost-usd 20 --model claude-sonnet-5-5
          --scaffold --allow-tools Bash Write Edit
          --trust-plugin --json evals-result.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evals-result
          path: |
            evals-result.json
            orc/evals/results/
          if-no-files-found: ignore
