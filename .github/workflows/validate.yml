name: validate

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: these jobs only read the repo. Bump per-job if one ever needs more.
permissions:
  contents: read

# Cancel superseded runs on rapid pushes / PR updates.
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # verify-version.sh checks the README ref against real tags

      - name: Syntax-check hook scripts, libs, bin
        run: |
          status=0
          for f in orc/hooks/scripts/*.sh orc/lib/*.sh orc/bin/*; do
            [ -e "$f" ] || continue
            bash -n "$f" || status=1
          done
          exit "$status"

      - name: Shellcheck first-party scripts
        run: bash scripts/ci/shellcheck.sh

      - name: Validate all JSON
        run: git ls-files '*.json' | xargs -n1 jq empty

      - name: tools.json canonical mirror in sync
        run: |
          if ! diff -u orc/lib/tools.json cli/internal/deps/tools.json; then
            echo "cli/internal/deps/tools.json has drifted from the canonical orc/lib/tools.json"
            echo "Re-copy: cp orc/lib/tools.json cli/internal/deps/tools.json"
            exit 1
          fi

      - name: Tool-check hook smoke test
        run: |
          # Hook must emit valid JSON on the missing-tools path (seam forces
          # only git present -> jq + all recommended reported missing).
          out=$(ORC_TOOLCHECK_PRESENT="git" bash orc/hooks/scripts/session-start-tool-check.sh)
          printf '%s' "$out" | jq empty
          printf '%s' "$out" | jq -e '.systemMessage | contains("jq")' >/dev/null

      - name: Callout lint (palette-only callouts)
        run: |
          bad=$(grep -rn '\[!' orc --include='*.md' | grep -vE '\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION|TYPE)\]' || true)
          if [ -n "$bad" ]; then
            echo "Non-palette callouts found:"
            echo "$bad"
            exit 1
          fi

      - name: Reference integrity (skills / commands / agents cross-refs)
        run: bash scripts/ci/verify-refs.sh

      - name: Hook wiring + userConfig consumers
        run: bash scripts/ci/verify-hooks.sh

      - name: Guard-hook smoke tests (branch-check + no-ai-attribution)
        run: bash scripts/ci/verify-guard-hooks.sh

      - name: Router map covers every command
        run: |
          missing=""
          for f in orc/commands/*.md; do
            name=$(basename "$f" .md)
            grep -q "orc:${name}" orc/skills/map/SKILL.md || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "orc/skills/map/SKILL.md is missing command(s):$missing"
            exit 1
          fi

      - name: Frontmatter conventions
        run: bash scripts/ci/verify-frontmatter.sh

      - name: Count + marketplace/architecture consistency
        run: bash scripts/ci/verify-counts.sh

      - name: Version / release-ref consistency
        run: bash scripts/ci/verify-version.sh

  plugin-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code CLI
        # Pinned for reproducibility; bumped via dependabot/PR, not floating latest.
        run: npm install -g @anthropic-ai/claude-code@2.1.220
      - name: Validate plugin manifest (strict)
        run: claude plugin validate ./orc --strict

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans full history
      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: go.mod / go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: cli

      - name: go build
        run: go build ./...

      - name: go test (race + coverage)
        run: |
          go test -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
